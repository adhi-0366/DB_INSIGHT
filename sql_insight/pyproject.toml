[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insightsql"
version = "0.1.0"
description = "Read-only natural-language analytics for SQLite"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30,<3",
    "pandas>=2.0,<4",
    "sqlglot>=25,<30",
    "streamlit>=1.38,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
