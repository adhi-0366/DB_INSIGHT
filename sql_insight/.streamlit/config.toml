[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.75rem"
buttonRadius = "0.65rem"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
codeFontSize = "0.9rem"
baseFontSize = 15
baseFontWeight = 400
headingFontWeights = [700, 650, 600, 600, 550, 500]

[theme.light]
primaryColor = "#0E7490"
backgroundColor = "#F5F8FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#102033"
borderColor = "#DCE5EF"
codeBackgroundColor = "#EDF3F8"
dataframeHeaderBackgroundColor = "#E8F0F7"
dataframeHeaderTextColor = "#102033"
chartCategoricalColors = ["#0E7490", "#2563EB", "#16A34A", "#9333EA", "#EA580C"]

[theme.light.sidebar]
backgroundColor = "#EDF3F8"
secondaryBackgroundColor = "#E4EDF5"
borderColor = "#D3DFEA"

[theme.dark]
primaryColor = "#22D3C5"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#121D2E"
textColor = "#E8F0FA"
borderColor = "#25354B"
codeBackgroundColor = "#101A2A"
dataframeHeaderBackgroundColor = "#18273A"
dataframeHeaderTextColor = "#E8F0FA"
chartCategoricalColors = ["#22D3C5", "#60A5FA", "#4ADE80", "#C084FC", "#FDBA74"]

[theme.dark.sidebar]
backgroundColor = "#0E1726"
secondaryBackgroundColor = "#162338"
borderColor = "#25354B"
